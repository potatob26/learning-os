name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # lock 是在 Windows 上生成的，npm ci / npm install 都会沿用其中缺失的
        # Linux 原生可选依赖；CI 里直接不用 lock，让 npm 按当前平台重新解析。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b

      - name: Pure-node checks
        run: node scripts/check-quotes.mjs

      - name: Web build
        run: npm run build

  # 界面与像素审计需要 Chrome 与三个本地服务器，太重，不在每次 PR 里跑。
  # 需要时本地执行：node scripts/run-regression.mjs（约 21 分钟，见 README/文档）。
