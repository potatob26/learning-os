distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 原为 https://services.gradle.org/distributions/gradle-8.14.3-all.zip
# 该地址会 307 重定向到 CDN，Gradle wrapper 在重定向后证书链校验失败
# （PKIX path building failed），而同一台机器上 JVM 直连各构建源其实都正常。
# 这里改为指向本地已下载的发行包，绕开该问题，构建结果完全等价。
distributionUrl=file\:/D:/Android/download/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
