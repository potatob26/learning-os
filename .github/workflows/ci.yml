name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm optional deps bug：Windows 上生成的 lock 可能缺 Linux 原生包，
      # 会让 CI 的 vite build 依次报 rollup / lightningcss / tailwind oxide 缺失。
      - name: Ensure linux native binaries
        run: |
          npm i --no-save @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
          npm i --no-save lightningcss-linux-x64-gnu@$(node -p "require('./node_modules/lightningcss/package.json').version")
          npm i --no-save @tailwindcss/oxide-linux-x64-gnu@$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")

      - name: Typecheck
        run: npx tsc -b

      - name: Pure-node checks
        run: node scripts/check-quotes.mjs

      - name: Web build
        run: npm run build

  # 界面与像素审计需要 Chrome 与三个本地服务器，太重，不在每次 PR 里跑。
  # 需要时本地执行：node scripts/run-regression.mjs（约 21 分钟，见 README/文档）。
